services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      AUTH_MODE: ${AUTH_MODE:-direct_jwt}
      DATABASE_URL: postgresql+psycopg://healthcare_app:${POSTGRES_PASSWORD:-change_me_for_local_development}@db:5432/${POSTGRES_DB:-healthcare}
      JWT_ISSUER: ${JWT_ISSUER:-https://localhost:9443/oauth2/token}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-secure-healthcare-api}
      JWKS_URL: ${JWKS_URL:-https://localhost:9443/oauth2/jwks}
      WSO2_BACKEND_JWT_HEADER: ${WSO2_BACKEND_JWT_HEADER:-X-JWT-Assertion}
      WSO2_BACKEND_JWT_ISSUER: ${WSO2_BACKEND_JWT_ISSUER:-https://localhost:9443/oauth2/token}
      WSO2_BACKEND_JWT_AUDIENCE: ${WSO2_BACKEND_JWT_AUDIENCE:-secure-healthcare-api}
      WSO2_BACKEND_JWT_JWKS_URL: ${WSO2_BACKEND_JWT_JWKS_URL:-https://localhost:9443/oauth2/jwks}
      WSO2_BACKEND_JWT_ALGORITHMS: ${WSO2_BACKEND_JWT_ALGORITHMS:-RS256}
      TRUSTED_GATEWAY_HOSTS: ${TRUSTED_GATEWAY_HOSTS:-localhost,127.0.0.1}
      ALLOW_DIRECT_ACCESS: ${ALLOW_DIRECT_ACCESS:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # Loopback-only development access. Use wso2/config/docker-compose.private.yml
      # to remove host publication when WSO2 shares the Compose network.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
