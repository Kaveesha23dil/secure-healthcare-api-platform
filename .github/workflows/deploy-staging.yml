name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthcare-api-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, wso2-staging]
    environment: staging
    env:
      WSO2_USERNAME: ${{ secrets.WSO2_STAGING_USERNAME }}
      WSO2_PASSWORD: ${{ secrets.WSO2_STAGING_PASSWORD }}
      WSO2_HOST: ${{ secrets.WSO2_STAGING_HOST }}
      WSO2_GATEWAY_URL: ${{ secrets.WSO2_STAGING_GATEWAY_URL }}
      WSO2_ACCESS_TOKEN: ${{ secrets.WSO2_STAGING_ACCESS_TOKEN }}
      WSO2_ENVIRONMENT: staging
      WSO2_API_CONTEXT: /healthcare/1.0.0
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      APICTL_API_PROJECT: ${{ vars.APICTL_API_PROJECT }}
      APICTL_PARAMS_FILE: ${{ vars.APICTL_PARAMS_FILE }}
      CONFIRM_STAGING_DEPLOY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: python -m ruff check . && python -m ruff format --check .
        working-directory: backend
      - run: python -m mypy app && python -m pytest
        working-directory: backend
      - shell: pwsh
        run: ./apiops/scripts/deploy-api-staging.ps1
      - shell: pwsh
        run: ./apiops/scripts/gateway-smoke-test.ps1
