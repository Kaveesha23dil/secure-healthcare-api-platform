name: CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './backend[dev]'
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m ruff format --check .
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m ruff check --config backend/pyproject.toml apiops/scripts/api_contract_checks.py
      - run: python -m ruff format --check --config backend/pyproject.toml apiops/scripts/api_contract_checks.py
      - run: python apiops/scripts/api_contract_checks.py validate
      - name: Check API compatibility
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: python apiops/scripts/api_contract_checks.py breaking --base "$API_BASE_REF"
      - name: Scan tracked files for secret material
        run: python apiops/scripts/scan_secrets.py
      - run: docker build -t secure-healthcare-api:ci ./backend
      - name: Verify image user
        run: test "$(docker image inspect secure-healthcare-api:ci --format '{{.Config.User}}')" = api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_WSO2_AUTHORIZATION_URL: https://wso2.invalid/oauth2/authorize
          VITE_WSO2_TOKEN_URL: https://wso2.invalid/oauth2/token
          VITE_WSO2_LOGOUT_URL: https://wso2.invalid/oidc/logout
          VITE_WSO2_CLIENT_ID: ci-public-client
          VITE_OAUTH_REDIRECT_URI: http://127.0.0.1:5173/auth/callback
          VITE_OAUTH_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:5173/login
          VITE_OAUTH_SCOPES: openid profile roles
          VITE_WSO2_GATEWAY_URL: https://gateway.invalid
          VITE_WSO2_API_CONTEXT: /healthcare/1.0.0
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ci-evidence
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
