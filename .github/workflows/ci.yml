name: CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './backend[dev]'
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m ruff format --check .
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python -m ruff check --config backend/pyproject.toml apiops/scripts/api_contract_checks.py
      - run: python -m ruff format --check --config backend/pyproject.toml apiops/scripts/api_contract_checks.py
      - run: python apiops/scripts/api_contract_checks.py validate
      - name: Check API compatibility
        if: github.event_name == 'pull_request'
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: python apiops/scripts/api_contract_checks.py breaking --base "$API_BASE_REF"
      - name: Scan tracked files for secret material
        run: python apiops/scripts/scan_secrets.py
      - run: docker build -t secure-healthcare-api:ci ./backend
      - name: Verify image user
        run: test "$(docker image inspect secure-healthcare-api:ci --format '{{.Config.User}}')" = api
