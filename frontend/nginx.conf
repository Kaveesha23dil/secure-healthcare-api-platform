server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy for the WSO2 OAuth token endpoint.
    # The WSO2 token endpoint sends no CORS headers, so browser
    # fetch() from this origin would be blocked without the proxy.
    location /wso2/oauth2/token {
        proxy_pass https://host.docker.internal:9443/oauth2/token;
        proxy_ssl_verify off;
        proxy_set_header Host localhost:9443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_body on;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
